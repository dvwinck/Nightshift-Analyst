# Tool configuration only (the project is not packaged). Runtime deps: requirements.txt.
# Python 3.9 syntax only (matches the Dockerfile): Optional[X], not X | None.

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
# E4/E7/E9/F = ruff defaults. T20 = no print(); BLE = no blind `except Exception`;
# SIM = simplifications. All of these pass on the current code and are enforced in CI.
# Not enabled yet because they fail on existing code: I (import order), B, UP, DTZ, S.
select = ["E4", "E7", "E9", "F", "T20", "BLE", "SIM"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
